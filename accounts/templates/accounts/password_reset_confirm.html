<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تغییر رمز عبور</title>
  <style>
    body {font-family: sans-serif; background: #f5f5f5; display:flex; align-items:center; justify-content:center; height:100vh;}
    .box {background:white; padding:30px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); width:360px;}
    input {width:100%; padding:10px; margin-top:10px; border:1px solid #ccc; border-radius:6px;}
    button {width:100%; padding:10px; background:#007bff; color:white; border:none; border-radius:6px; margin-top:15px; cursor:pointer;}
    button:hover {background:#0056b3;}
    .msg {margin-top:10px; color:red;}
  </style>
</head>
<body>
<div class="box">
  {% if validlink %}
    <h3>تغییر رمز عبور</h3>
    <form action='' method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">ذخیره رمز عبور جدید</button>
    </form>
  {% else %}
    <div class="msg">این لینک نامعتبر یا منقضی شده است.</div>
  {% endif %}
</div>
</body>
</html>
