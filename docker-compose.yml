version: "3.9"

services:

  backend:
    build:
      context: ./backend
    container_name: beauty_backend
    command: >
      sh -c "
      python manage.py migrate &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: beauty_postgres
    restart: always
    environment:
      POSTGRES_DB: beauty_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: beauty_redis
    ports:
      - "6379:6379"

  celery:
    build:
      context: ./backend
    container_name: beauty_celery
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - backend
      - redis
  celery_beat:
    build:
      context: ./backend
    container_name: beauty_celery_beat
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - backend
volumes:
  postgres_data: