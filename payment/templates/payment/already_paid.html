<!-- templates/payment/already_paid.html -->
<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>Invalid payment</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 10px; display: inline-block; }
        .info { color: #ff9800; font-size: 20px; margin-bottom: 10px; }
        .btn { background: #2196F3; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <p class="info">Payment has been paid before</p>
        <p>Transaction number<strong>{{ ref_id }}</strong></p>
        <a class="btn" href="{{ frontend_callback_url }}">Back to app</a>
    </div>
</body>
</html>
